<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 132" width="600" height="132" role="img" aria-label="Llamafile Brain">
  <g transform="translate(2 6) scale(0.1172)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2b53"/>
      <stop offset="1" stop-color="#0c1022"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#7aa2ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- two hemispheres -->
  <g id="lobe" fill="#7aa2ff" fill-opacity="0.10" stroke="url(#ac)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 496 232 C 410 200 292 224 262 330 C 196 352 176 442 220 502 C 180 562 212 658 296 676 C 326 752 440 774 496 728 Z"/>
  </g>
  <g fill="#7aa2ff" fill-opacity="0.10" stroke="url(#ac)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" transform="translate(1024 0) scale(-1 1)">
    <path d="M 496 232 C 410 200 292 224 262 330 C 196 352 176 442 220 502 C 180 562 212 658 296 676 C 326 752 440 774 496 728 Z"/>
  </g>

  <!-- folds -->
  <g fill="none" stroke="url(#ac)" stroke-width="14" stroke-linecap="round" opacity="0.8">
    <path d="M 262 330 C 320 340 350 380 340 430"/>
    <path d="M 220 502 C 290 498 330 530 322 580"/>
    <path d="M 296 676 C 350 650 400 660 420 700"/>
    <path d="M 762 330 C 704 340 674 380 684 430"/>
    <path d="M 804 502 C 734 498 694 530 702 580"/>
    <path d="M 728 676 C 674 650 624 660 604 700"/>
  </g>

  <!-- neural nodes -->
  <g stroke="#e8f0ff" stroke-width="9" stroke-linecap="round" opacity="0.9">
    <line x1="400" y1="330" x2="512" y2="420"/><line x1="624" y1="330" x2="512" y2="420"/>
    <line x1="400" y1="330" x2="400" y2="560"/><line x1="624" y1="330" x2="624" y2="560"/>
    <line x1="512" y1="420" x2="400" y2="560"/><line x1="512" y1="420" x2="624" y2="560"/>
    <line x1="400" y1="560" x2="512" y2="650"/><line x1="624" y1="560" x2="512" y2="650"/>
  </g>
  <g fill="#e8f0ff">
    <circle cx="400" cy="330" r="26"/><circle cx="624" cy="330" r="26"/>
    <circle cx="512" cy="420" r="32" fill="#5eead4"/>
    <circle cx="400" cy="560" r="26"/><circle cx="624" cy="560" r="26"/>
    <circle cx="512" cy="650" r="26"/>
  </g>
</g>
  <text x="150" y="38" font-family="'DejaVu Serif', Georgia, 'Times New Roman', serif" font-size="36" letter-spacing="1" fill="#2e2c47">LLAMAFILE</text>
  <text x="146" y="126" font-family="'DejaVu Serif', Georgia, 'Times New Roman', serif" font-size="100" fill="#111111">Brain</text>
  <text x="436" y="70" font-family="'DejaVu Serif', Georgia, 'Times New Roman', serif" font-size="14" fill="#8a8fa3">NC</text>
</svg>
